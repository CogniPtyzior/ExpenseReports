<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Facturation</th>
        <th>Montant</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of entries(); track entry.id) {
      <tr>
        <td>{{ formatExpenseDate(entry.expenseDate) }}</td>
        <td>
          <strong>{{ entry.description }}</strong>
        </td>
        <td>
          <strong>{{ entry.merchantName }}</strong>
          <small
            >{{ entry.street }}, {{ entry.postalCode }} {{ entry.city }}</small
          >
        </td>
        <td>{{ formatAmount(entry.amount) }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
