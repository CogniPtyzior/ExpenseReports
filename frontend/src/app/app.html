<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/reports" aria-label="Expense management home">
      <span class="brand-mark">EM</span>
      <span class="brand-text">Expense Management</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      @for (item of navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/reports' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
